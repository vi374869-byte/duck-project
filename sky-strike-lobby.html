<!doctype html><html data-arcade-game="lobby"><head><script src="arcade-economy.js" data-game="multi"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Strike Lobby</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Trebuchet MS,Arial;color:#503b66;background:linear-gradient(#9fdff5 0 66%,#a4dc8b 66%)}main{width:min(620px,94vw);padding:28px;border:6px solid white;border-radius:30px;background:#edf9ff;box-shadow:0 9px #4389bd;text-align:center}h1{margin:0;color:#397fc0;font-size:clamp(2.2rem,8vw,4rem);text-shadow:0 4px white}p{font-weight:bold}.back,button{border:3px solid white;border-radius:13px;padding:10px 13px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px #a5bdd5}.back{background:#fff09b;color:#704d00;float:left}.weapons,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.weapon{min-height:112px;background:#d6ecff;color:#355576}.weapon.active{background:#ffcf94;outline:4px solid #f09275}.weapon b{display:block;font-size:1.15rem}.actions button{background:#8ed6aa;color:#244e3b}.actions button+button{background:#bda5eb;color:#4c3b6c}input{width:100%;border:3px solid #a7d8ec;border-radius:12px;padding:11px;text-align:center;font:inherit;font-weight:bold}label{display:block;text-align:left;margin:16px 0 6px;font-size:.78rem;font-weight:bold;letter-spacing:.08em}.status{min-height:25px;color:#407d9e}.players{font-size:.9rem;font-weight:bold}@media(max-width:430px){.weapons,.actions{grid-template-columns:1fr}}</style><link rel="icon" type="image/svg+xml" href="game-logo-multi.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head><body><main><button class="back" id="back">← Arcade</button><img class="arcade-menu-logo" src="game-logo-multi.svg" alt=""><h1>Sky Strike</h1><p>Private online arena · Every player uses their own screen.</p><label>CHOOSE YOUR STARTING WEAPON</label><section class="weapons"><button class="weapon active" data-w="rifle"><b>🔫 Rifle</b>Fast and steady</button><button class="weapon" data-w="plasma"><b>⚡ Plasma</b>Slower, stronger shots</button></section><label>YOUR NAME</label><input id="name" maxlength="18" value="Player"><label>ROOM CODE</label><input id="code" maxlength="6" placeholder="JOIN A FRIEND'S CODE"><p>Earn 5 coins per 30 seconds of active play with another player.</p><div class="actions"><button id="create">CREATE LOBBY</button><button id="join">JOIN LOBBY</button></div><p class="status" id="status">Connecting to the Sky Strike server…</p><p class="players" id="players"></p></main><script>(()=>{let weapon='rifle',ws,room='';const $=s=>document.querySelector(s),status=$('#status'),players=$('#players');function url(){return (location.protocol==='https:'?'wss':'ws')+'://'+location.hostname+':8765'}function set(s){status.textContent=s}function play(){location.href='sky-strike-online.html?room='+encodeURIComponent(room)+'&name='+encodeURIComponent($('#name').value||'Player')+'&weapon='+weapon}function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));else set('Server is offline. Run multiplayer_server.py first.')}function connect(){ws=new WebSocket(url());ws.onopen=()=>set('Ready — create or join a private room.');ws.onclose=()=>set('Server offline. Run multiplayer_server.py first.');ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')return set(m.message);if(m.type==='room_joined'){room=m.room;players.textContent='Lobby: '+m.players.join(' · ');set('Room '+room+' is ready. Starting match…');setTimeout(play,650)}if(m.type==='players')players.textContent='Lobby: '+m.players.join(' · ')}}document.querySelectorAll('.weapon').forEach(b=>b.onclick=()=>{weapon=b.dataset.w;document.querySelectorAll('.weapon').forEach(x=>x.classList.toggle('active',x===b))});$('#create').onclick=()=>send({type:'create_room',player:$('#name').value});$('#join').onclick=()=>send({type:'join_room',room:$('#code').value,player:$('#name').value});$('#back').onclick=()=>parent!==window?parent.postMessage({type:'game-return-hub'},'*'):location.href='index.html';connect()})()</script></body></html>
