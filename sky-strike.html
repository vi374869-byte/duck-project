<!doctype html><html data-arcade-game="multi"><head><script src="arcade-economy.js" data-game="multi"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Strike</title><style>*{box-sizing:border-box}body{margin:0;background:#171b3a;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh}.game{width:min(1050px,100vw);height:min(700px,100vh);padding:12px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;background:#282d5b}header,footer{display:flex;justify-content:space-between;align-items:center;font-weight:bold;gap:8px}.pill,button{padding:8px 11px;border:3px solid white;border-radius:12px;font-weight:bold}.pill{background:#343c78}button{cursor:pointer;background:#9ddfff;color:#17365d}.quit,.start{background:#ffe99d;color:#694000}.arena{position:relative;min-height:0;border:5px solid #ffb087;border-radius:20px;overflow:hidden;background:#10142d}canvas{width:100%;height:100%;display:block;touch-action:none}.intro{position:absolute;inset:0;display:grid;place-items:center;background:#11162bb9;text-align:center}.intro div{padding:25px;border:4px solid white;border-radius:25px;background:#414882;max-width:500px}.intro[hidden]{display:none}.start{margin-top:12px;font-size:1rem}@media(max-width:600px){.game{padding:6px}header{font-size:.72rem}footer span{display:none}}</style><link rel="icon" type="image/svg+xml" href="game-logo-multi.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head><body><main class="game"><header><button class="quit" id="quit">← Arcade</button><b>🎯 SKY STRIKE</b><span><i class="pill" id="hp">♥ 100</i> <i class="pill" id="score">0 KOs</i></span></header><section class="arena"><canvas id="c"></canvas><div class="intro" id="intro"><div><img class="arcade-menu-logo" src="game-logo-multi.svg" alt=""><h1>Sky Strike</h1><p>Move with WASD or arrows. Aim and fire with click or touch.</p><button class="start" id="start">START MATCH</button></div></div></section><footer><span>Defeat 3 bots · You respawn after getting knocked out</span><span><button id="rifle">1 Rifle</button> <button id="plasma">2 Plasma</button></span></footer></main><script>(()=>{let c=document.querySelector('#c'),g=c.getContext('2d'),W,H,on=0,last=0,keys=new Set(),aim={x:0,y:0,fire:0},shots=[],ko=0,gun='rifle',cool=0;let p={n:'YOU',x:0,y:0,h:100,col:'#a0cdb7',dead:0},bots=['Rook','Nova','Blitz'].map((n,i)=>({n,x:0,y:0,h:100,col:['#e4b2c4','#c4b0d9','#ebd09c'][i],dead:0,cool:i}));function resize(){let r=c.getBoundingClientRect(),s=Math.min(devicePixelRatio,2);c.width=r.width*s;c.height=r.height*s;g.setTransform(s,0,0,s,0,0);W=r.width;H=r.height;p.x=W/2;p.y=H/2;bots.forEach((b,i)=>{b.x=W*(.2+i*.3);b.y=i==1?H*.72:H*.2})}function clamp(a){a.x=Math.max(22,Math.min(W-22,a.x));a.y=Math.max(22,Math.min(H-22,a.y))}function fire(o,a,type){let fast=type=='plasma'?420:680,dam=type=='plasma'?34:16;shots.push({x:o.x,y:o.y,vx:Math.cos(a)*fast,vy:Math.sin(a)*fast,o,dam,life:1,col:type=='plasma'?'#d5a0ff':'#9cf5ff'})}function hit(t,s){t.h-=s.dam;if(t.h<=0){t.h=0;t.dead=1.4;if(s.o==p){ko++;Arcade.earn(5);document.querySelector('#score').textContent=ko+' KOs'}}}function update(d){if(!on)return;let dx=(keys.has('d')||keys.has('arrowright'))-(keys.has('a')||keys.has('arrowleft')),dy=(keys.has('s')||keys.has('arrowdown'))-(keys.has('w')||keys.has('arrowup'));if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*250*d;p.y+=dy/l*250*d;clamp(p)}const ax=Number(keys.has('l'))-Number(keys.has('j')),ay=Number(keys.has('k'))-Number(keys.has('i'));if(ax||ay){aim.x=p.x+ax*200;aim.y=p.y+ay*200;}p.a=Math.atan2(aim.y-p.y,aim.x-p.x);cool-=d;if((aim.fire||keys.has(" "))&&cool<0&&!p.dead){fire(p,p.a,gun);cool=gun=='plasma'?.48:.13}bots.forEach(b=>{if(b.dead){b.dead-=d;if(b.dead<=0){b.dead=0;b.h=100;b.x=60+Math.random()*(W-120);b.y=60+Math.random()*(H-120)}return}let a=Math.atan2(p.y-b.y,p.x-b.x);b.a=a;if(Math.hypot(p.x-b.x,p.y-b.y)>210){b.x+=Math.cos(a)*80*d;b.y+=Math.sin(a)*80*d;clamp(b)}b.cool-=d;if(b.cool<0&&!p.dead){fire(b,a+(Math.random()-.5)*.3,Math.random()>.7?'plasma':'rifle');b.cool=.45+Math.random()*.4}});shots=shots.filter(s=>{s.x+=s.vx*d;s.y+=s.vy*d;s.life-=d;if(s.life<0)return 0;for(let t of(s.o==p?bots:[p]))if(!t.dead&&Math.hypot(t.x-s.x,t.y-s.y)<21){hit(t,s);return 0}return 1});if(p.h<=0&&!p.dead)p.dead=1.4;if(p.dead){p.dead-=d;if(p.dead<=0){p.dead=0;p.h=100;p.x=W/2;p.y=H/2}}document.querySelector('#hp').textContent=p.dead?'RESPAWNING…':'♥ '+Math.ceil(p.h)}function unit(a){if(a.dead)return;ArcadeArt.pilot(g,a.x,a.y,a.a,a.col,a.n,a.h)}function draw(){ArcadeArt.arena(g,W,H);[[W*.16,H*.46,140,36],[W*.53,H*.25,120,45],[W*.7,H*.68,150,36]].forEach(a=>ArcadeArt.obstacle(g,...a));shots.forEach(s=>ArcadeArt.pellet(g,s.x,s.y,s.col));bots.forEach(unit);unit(p)}function loop(t){let d=Math.min(.04,(t-last||0)/1000);last=t;update(d);draw();requestAnimationFrame(loop)}function point(e){let r=c.getBoundingClientRect(),q=e.touches?.[0]||e;aim.x=q.clientX-r.left;aim.y=q.clientY-r.top}function start(){on=1;document.querySelector('#intro').hidden=1}let firePointer=null;c.onpointerdown=e=>{firePointer=e.pointerId;c.setPointerCapture(e.pointerId);point(e);aim.fire=1;start()};c.onpointermove=e=>{if(firePointer===null||e.pointerId===firePointer)point(e)};onpointerup=e=>{if(e.pointerId===firePointer){aim.fire=0;firePointer=null}};onblur=()=>{keys.clear();aim.fire=0};onpointercancel=()=>{aim.fire=0;firePointer=null};window.addEventListener("arcade-input-reset",()=>{keys.clear();aim.fire=0;firePointer=null});onkeydown=e=>{keys.add(e.key.toLowerCase());if(e.key==='Enter')start();if(e.key=='1')gun='rifle';if(e.key=='2')gun='plasma'};onkeyup=e=>keys.delete(e.key.toLowerCase());document.querySelector('#start').onclick=start;document.querySelector('#rifle').onclick=()=>gun='rifle';document.querySelector('#plasma').onclick=()=>gun='plasma';document.querySelector('#quit').onclick=()=>parent!=window?parent.postMessage({type:'game-return-hub'},'*'):location='index.html';new ResizeObserver(resize).observe(c);resize();requestAnimationFrame(loop)})();</script></body></html>
