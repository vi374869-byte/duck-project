<!doctype html><html data-arcade-game="space"><head><script src="arcade-economy.js" data-game="space"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Space Wars · Starlight Trail</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050e;font-family:Arial;color:#fff}main{height:100%;display:grid;grid-template-rows:62px 1fr 74px;background:#050725}header,footer{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#0b123b;border-color:#19def7;border-style:solid;font-weight:bold}header{border-width:0 0 3px}footer{border-width:3px 0 0;justify-content:center;gap:14px}canvas{width:100%;height:100%;display:block;touch-action:none}button{border:2px solid #21e6ff;border-radius:12px;padding:9px 13px;background:#172d86;color:#fff;font-weight:bold;cursor:pointer}.boost{background:#7c246d;border-color:#ff91db}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#03050ed9;z-index:5}.panel{width:min(430px,90%);padding:30px;background:#0a1139;border:2px solid #21e6ff;border-radius:25px;text-align:center;box-shadow:0 0 40px #00e5ff55}.panel h1{margin:5px 0;color:#56efff;font:900 clamp(2rem,7vw,3.6rem) monospace;text-shadow:0 0 18px #00d8ff}.panel p{color:#cbd8ff;line-height:1.5}.hidden{display:none}</style><link rel="icon" type="image/svg+xml" href="game-logo-space.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head><body><main><header><span><img class="arcade-inline-logo" src="game-logo-space.svg" alt="">Space Wars</span><span>◇ <b id="points">0</b> · Missed <b id="misses">0</b>/10</span><button id="quit">← Sky Arcade</button></header><canvas id="game" width="900" height="540"></canvas><footer><button id="left">◀</button><button id="boost" class="boost">BOOST</button><button id="right">▶</button></footer></main><div id="menu" class="overlay"><div class="panel"><img class="arcade-menu-logo" src="game-logo-space.svg" alt=""><h1>Space Wars</h1><p>Collect the glowing blue diamonds along the starlight trail. Missing 10 ends the mission.</p><p>Click or drag to change lanes.</p><button id="launch">LAUNCH MISSION</button></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>MISSION OVER</h1><p id="result"></p><button id="restart">TRY AGAIN</button></div></div><script>const c=document.getElementById('game'),g=c.getContext('2d'),pointsEl=document.getElementById('points'),missEl=document.getElementById('misses'),menu=document.getElementById('menu'),over=document.getElementById('over'),boostBtn=document.getElementById('boost');let lane=1,target=1,diamonds=[],points=0,misses=0,playing=false,boosting=false,last=0,wait=0,drag=false;const stars=Array.from({length:120},()=>({x:Math.random()*900,y:Math.random()*420,r:Math.random()*2}));function roadX(l,y){const horizon=c.height*2/9;return 450+(l-1)*Math.max(48,(y-horizon)/(c.height-horizon)*260)}function choose(x){let r=c.getBoundingClientRect(),p=(x-r.left)/r.width;target=p<.333?0:p<.667?1:2}function start(){lane=target=1;diamonds=[];points=misses=wait=0;boosting=drag=false;playing=true;pointsEl.textContent=0;missEl.textContent=0;menu.classList.add('hidden');over.classList.add('hidden')}function lose(){playing=false;document.getElementById('result').textContent=`You collected ${points} blue diamonds and missed ${misses}.`;over.classList.remove('hidden')}function background(){ArcadeArt.space(g)}function ship(x,y){ArcadeArt.ship(g,x,y)}function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing){let speed=boosting?1.8:1;wait-=dt;if(wait<=0){diamonds.push({lane:Math.random()*3|0,z:0});wait=boosting?.42:.72}lane+=(target-lane)*12*dt;for(let i=diamonds.length-1;i>=0;i--){let d=diamonds[i];d.z+=speed*dt*.5;if(d.z>=1){if(Math.abs(d.lane-lane)<.38){points++;Arcade.earn(1);pointsEl.textContent=points}else{misses++;missEl.textContent=misses;if(misses>=10){lose();break}}diamonds.splice(i,1)}}}background();diamonds.forEach(d=>{let y=c.height*2/9+d.z*(c.height*7/9-30),x=roadX(d.lane,y),z=14+d.z*30;ArcadeArt.gem(g,x,y,z)});ship(roadX(lane,c.height-62),c.height-70);requestAnimationFrame(frame)}c.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;c.setPointerCapture(e.pointerId);choose(e.clientX)});c.addEventListener('pointermove',e=>{if(drag)choose(e.clientX)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>c.addEventListener(k,()=>drag=false));document.getElementById('left').onclick=()=>target=Math.max(0,target-1);document.getElementById('right').onclick=()=>target=Math.min(2,target+1);boostBtn.onpointerdown=()=>boosting=true;['pointerup','pointerleave','pointercancel'].forEach(k=>boostBtn.addEventListener(k,()=>boosting=false));document.getElementById('launch').onclick=start;document.getElementById('restart').onclick=start;document.getElementById('quit').onclick=()=>{playing=false;if(parent!==window)parent.postMessage({type:'game-return-hub'},'*');else location.href='index.html'};new ResizeObserver(()=>{const r=c.getBoundingClientRect();if(r.width>0&&r.height>0){const h=Math.round(900*r.height/r.width);if(c.height!==h)c.height=h;}}).observe(c);requestAnimationFrame(frame);</script><script src="arcade-game-inputs.js"></script></body></html>
