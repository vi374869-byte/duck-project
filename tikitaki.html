<!DOCTYPE html>
<html lang="en" data-arcade-game="tiki">
<head><script src="arcade-economy.js" data-game="tiki"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TikiTaki - Island Totem Tic-Tac-Toe</title>
<style>
  :root {
    --sun-color: #ff9800;
    --sun-glow: #ff5722;
    --moon-color: #00e5ff;
    --moon-glow: #7c4dff;
    --wood-border: #4e342e;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  body {
    background: radial-gradient(circle at center, #1b3b4f 0%, #061622 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow-x: hidden;
    padding: 10px;
  }

  header {
    text-align: center;
    margin-top: 5px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 2px;
    color: #ffe082;
    text-shadow: 0 0 10px rgba(255, 224, 130, 0.5), 0 3px 0 #3e2723;
  }
  #turn-indicator {
    font-size: 15px;
    margin-top: 4px;
    font-weight: bold;
    padding: 4px 16px;
    border-radius: 20px;
    display: inline-block;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s ease;
  }

  /* Game Arena Layout */
  #arena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }

  /* Player Stats / Mana Display */
  .players-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 10px;
  }
  .player-box {
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid #555;
    padding: 8px 12px;
    border-radius: 12px;
    width: 47%;
    transition: border-color 0.3s, transform 0.3s;
  }
  .player-box.sun.active {
    border-color: var(--sun-color);
    box-shadow: 0 0 12px var(--sun-glow);
    transform: scale(1.03);
  }
  .player-box.moon.active {
    border-color: var(--moon-color);
    box-shadow: 0 0 12px var(--moon-glow);
    transform: scale(1.03);
  }
  .p-name {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sun .p-name { color: var(--sun-color); }
  .moon .p-name { color: var(--moon-color); }

  .mana-track {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }
  .mana-gem {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #333;
    border: 1px solid #777;
    transition: all 0.2s;
  }
  .mana-gem.filled {
    background: #00e676;
    box-shadow: 0 0 8px #00e676;
    border-color: #fff;
  }

  /* 3x3 Sandbar Grid */
  #board-container {
    position: relative;
    padding: 12px;
    background: #b58d57;
    border: 6px solid #4e342e;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 0 20px #8d6e63;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 85px);
    grid-template-rows: repeat(3, 85px);
    gap: 8px;
  }
  .cell {
    width: 85px;
    height: 85px;
    background: #c7a76d;
    border: 2px dashed #9e8150;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
    transition: background 0.2s, transform 0.1s;
  }
  .cell:hover {
    background: #d8b982;
  }
  .cell.lava {
    background: radial-gradient(circle, #ff3d00, #b71c1c) !important;
    border: 2px solid #ff9100;
    animation: lavaPulse 1.5s infinite alternate;
  }
  @keyframes lavaPulse {
    0% { box-shadow: inset 0 0 5px #ffd600, 0 0 10px #ff3d00; }
    100% { box-shadow: inset 0 0 15px #ffd600, 0 0 20px #ff3d00; }
  }

  /* Tokens */
  .tiki-piece {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #fff;
    font-size: 18px;
    transition: transform 0.2s;
  }
  .tiki-piece.size-1 { width: 42px; height: 42px; font-size: 16px; }
  .tiki-piece.size-2 { width: 58px; height: 58px; font-size: 22px; }
  .tiki-piece.size-3 { width: 74px; height: 74px; font-size: 28px; }

  .tiki-piece.sun {
    background: linear-gradient(135deg, #ffa726, #e65100);
    border-color: #ffe082;
  }
  .tiki-piece.moon {
    background: linear-gradient(135deg, #26c6da, #311b92);
    border-color: #80deea;
  }
  .tiki-piece.stone {
    background: linear-gradient(135deg, #90a4ae, #37474f) !important;
    border-color: #eceff1 !important;
  }

  /* Piece Selector & Actions */
  #inventory-tray {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 16px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .token-opt {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 6px;
    border-radius: 10px;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .token-opt.selected {
    border-color: #ffd54f;
    background: rgba(255, 255, 255, 0.15);
    transform: scale(1.1);
  }
  .token-bubble {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: #555;
    border: 1px solid #fff;
  }
  .token-count {
    font-size: 11px;
    font-weight: bold;
    margin-top: 3px;
  }

  /* Spells / Rites Bar */
  .spell-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    justify-content: center;
  }
  .spell-btn {
    flex: 1;
    max-width: 140px;
    background: linear-gradient(180deg, #37474f, #212121);
    color: #fff;
    border: 1px solid #78909c;
    border-radius: 10px;
    padding: 6px 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
  }
  .spell-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(1);
  }
  .spell-btn.active {
    border-color: #00e676;
    box-shadow: 0 0 10px #00e676;
    background: #1b5e20;
  }
  .mana-cost {
    font-size: 10px;
    color: #69f0ae;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 15, 25, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    backdrop-filter: blur(5px);
    text-align: center;
    padding: 20px;
  }
  .modal-overlay h2 {
    font-size: 32px;
    color: #ffd54f;
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(255, 213, 79, 0.6);
  }
  .modal-overlay p {
    font-size: 15px;
    max-width: 320px;
    line-height: 1.4;
    color: #cfd8dc;
    margin-bottom: 20px;
  }
  .btn-action {
    background: linear-gradient(180deg, #ff9800, #e65100);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #ffe082;
    border-radius: 25px;
    padding: 10px 28px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
  }
  /* Classic TikiTaki mode: no spells or special abilities. */
  .spell-bar, #inventory-tray, .mana-track { display: none !important; }
  #arena { flex: 1; max-width: none; justify-content: center; gap: 18px; }
  #board-container { padding: 18px; border-radius: 24px; }
  #board { grid-template-columns: repeat(3, min(26vw, 150px)); grid-template-rows: repeat(3, min(26vw, 150px)); gap: 12px; }
  .cell { width: min(26vw, 150px); height: min(26vw, 150px); border-radius: 18px; }
  .tiki-piece.size-1 { width: 72%; height: 72%; font-size: clamp(28px, 6vw, 54px); }
</style>
<link rel="icon" type="image/svg+xml" href="game-logo-tiki.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head>
<body>

  <header>
    <h1><img class="arcade-inline-logo" src="game-logo-tiki.svg" alt="">TikiTaki</h1>
    <div id="turn-indicator">Sun Tiki's Turn</div>
  </header>

  <div id="arena">

    <!-- Players & Mana Display -->
    <div class="players-bar">
      <div id="p-sun" class="player-box sun active">
        <div class="p-name">☀️ Sun Tiki</div>
        <div class="mana-track">
          <div class="mana-gem filled" id="sun-m1"></div>
          <div class="mana-gem" id="sun-m2"></div>
          <div class="mana-gem" id="sun-m3"></div>
        </div>
      </div>
      <div id="p-moon" class="player-box moon">
        <div class="p-name">🌙 Moon Tiki</div>
        <div class="mana-track">
          <div class="mana-gem" id="moon-m1"></div>
          <div class="mana-gem" id="moon-m2"></div>
          <div class="mana-gem" id="moon-m3"></div>
        </div>
      </div>
    </div>

    <!-- 3x3 Sandbar Grid -->
    <div id="board-container">
      <div id="board"></div>
    </div>

    <!-- Token Size Tray (Stacking Totems) -->
    <div id="inventory-tray">
      <div class="token-opt selected" id="opt-1" onclick="selectPieceSize(1)">
        <div class="token-bubble">🗿</div>
        <span class="token-count">Small (<span id="cnt-1">3</span>)</span>
      </div>
      <div class="token-opt" id="opt-2" onclick="selectPieceSize(2)">
        <div class="token-bubble" style="transform: scale(1.15);">🗿</div>
        <span class="token-count">Med (<span id="cnt-2">3</span>)</span>
      </div>
      <div class="token-opt" id="opt-3" onclick="selectPieceSize(3)">
        <div class="token-bubble" style="transform: scale(1.3);">🗿</div>
        <span class="token-count">Chief (<span id="cnt-3">2</span>)</span>
      </div>
    </div>

    <!-- Elemental Rites / Spells -->
    <div class="spell-bar">
      <button class="spell-btn" id="spell-lava" onclick="activateSpell('lava')" disabled>
        🌋 Volcanic Rift
        <span class="mana-cost">Cost: 2 Mana</span>
      </button>
      <button class="spell-btn" id="spell-gust" onclick="activateSpell('gust')" disabled>
        💨 Tropical Gust
        <span class="mana-cost">Cost: 1 Mana</span>
      </button>
      <button class="spell-btn" id="spell-stone" onclick="activateSpell('stone')" disabled>
        🗿 Stone Anchor
        <span class="mana-cost">Cost: 2 Mana</span>
      </button>
    </div>

  </div>

  <!-- Game Over Screen -->
  <div id="game-over-modal" class="modal-overlay" style="display: none;">
    <h2 id="winner-title">SUN TIKI WINS!</h2>
    <p id="winner-desc">Three Totems aligned across the sacred sands!</p>
    <button class="btn-action" onclick="resetGame()">PLAY AGAIN 🔁</button>
  </div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIS (Web Audio API)
   ========================================================================== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, type='sine', dur=0.15, gain=0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

/* ==========================================================================
   GAME STATE
   ========================================================================== */
const PLAYERS = {
  SUN: 'sun',
  MOON: 'moon'
};

let currentPlayer = PLAYERS.SUN;
let selectedSize = 1;
let activeSpellMode = null; // 'lava', 'gust', 'stone'
let gustSourceIndex = null;
let gameOver = false;

// Inventory per player: Small(3), Med(3), Large(2)
const inventory = {
  [PLAYERS.SUN]: { 1: 5, 2: 0, 3: 0 },
  [PLAYERS.MOON]: { 1: 5, 2: 0, 3: 0 }
};

// Mana pool (0 to 3)
const mana = {
  [PLAYERS.SUN]: 1,
  [PLAYERS.MOON]: 0
};

// 9 board cells. Each cell contains a stack array [] and state flags
const boardState = Array.from({ length: 9 }, () => ({
  stack: [], // Items: { player: 'sun'|'moon', size: 1|2|3, isStone: false }
  lavaDuration: 0 // rounds until lava dissipates
}));

/* ==========================================================================
   INITIALIZATION & RENDERING
   ========================================================================== */
function initBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.addEventListener('click', () => onCellClick(i));
    boardEl.appendChild(cell);
  }
  updateUI();
}

function updateUI() {
  // Update cells visual
  for (let i = 0; i < 9; i++) {
    const cellEl = document.getElementById('board').children[i];
    cellEl.innerHTML = '';
    const cellData = boardState[i];

    if (cellData.lavaDuration > 0) {
      cellEl.classList.add('lava');
    } else {
      cellEl.classList.remove('lava');
    }

    if (cellData.stack.length > 0) {
      const top = cellData.stack[cellData.stack.length - 1];
      const piece = document.createElement('div');
      piece.className = `tiki-piece ${top.player} size-${top.size} ${top.isStone ? 'stone' : ''}`;
      piece.innerText = top.player === PLAYERS.SUN ? '⭐' : '🌙';
      cellEl.appendChild(piece);
    }
  }

  // Turn Indicators
  const isSun = (currentPlayer === PLAYERS.SUN);
  document.getElementById('p-sun').classList.toggle('active', isSun);
  document.getElementById('p-moon').classList.toggle('active', !isSun);
  const turnTxt = document.getElementById('turn-indicator');
  turnTxt.innerText = `${isSun ? "Sun Tiki's" : "Moon Tiki's"} Turn`;
  turnTxt.style.color = isSun ? 'var(--sun-color)' : 'var(--moon-color)';

  // Mana Bars
  for (let m = 1; m <= 3; m++) {
    document.getElementById(`sun-m${m}`).classList.toggle('filled', m <= mana[PLAYERS.SUN]);
    document.getElementById(`moon-m${m}`).classList.toggle('filled', m <= mana[PLAYERS.MOON]);
  }

  // Inventory numbers for current player
  document.getElementById('cnt-1').innerText = inventory[currentPlayer][1];
  document.getElementById('cnt-2').innerText = inventory[currentPlayer][2];
  document.getElementById('cnt-3').innerText = inventory[currentPlayer][3];

  // Spell buttons eligibility
  const currentMana = mana[currentPlayer];
  document.getElementById('spell-lava').disabled = currentMana < 2;
  document.getElementById('spell-gust').disabled = currentMana < 1;
  document.getElementById('spell-stone').disabled = currentMana < 2;
}

function selectPieceSize(size) {
  initAudio();
  playTone(350, 'triangle', 0.08);
  selectedSize = size;
  activeSpellMode = null;
  resetSpellButtons();
  document.querySelectorAll('.token-opt').forEach((opt, idx) => {
    opt.classList.toggle('selected', idx + 1 === size);
  });
}

/* ==========================================================================
   TURN & SPELL MECHANICS
   ========================================================================== */
function activateSpell(type) {
  initAudio();
  if (activeSpellMode === type) {
    activeSpellMode = null;
    resetSpellButtons();
    return;
  }
  activeSpellMode = type;
  resetSpellButtons();
  document.getElementById(`spell-${type}`).classList.add('active');
  gustSourceIndex = null;
}

function resetSpellButtons() {
  document.querySelectorAll('.spell-btn').forEach(btn => btn.classList.remove('active'));
}

function onCellClick(index) {
  if (gameOver) return;
  initAudio();

  const cell = boardState[index];

  // Spell handling
  if (activeSpellMode) {
    handleSpellClick(index);
    return;
  }

  // Standard Stacking Placement
  if (cell.lavaDuration > 0) {
    playTone(150, 'sawtooth', 0.2, 0.1);
    return; // Blocked by lava
  }

  const top = cell.stack.length > 0 ? cell.stack[cell.stack.length - 1] : null;

  // Stacking Validation: Cell must be empty OR top piece must be smaller and NOT stone
  if (top) {
    if (top.isStone || top.size >= selectedSize) {
      playTone(180, 'sawtooth', 0.2, 0.1);
      return; // Cannot stack over larger, equal, or anchored piece
    }
  }

  // Inventory Check
  if (inventory[currentPlayer][selectedSize] <= 0) {
    playTone(180, 'sawtooth', 0.2, 0.1);
    return;
  }

  // Place Token
  inventory[currentPlayer][selectedSize]--;
  cell.stack.push({
    player: currentPlayer,
    size: selectedSize,
    isStone: false
  });

  playTone(480, 'sine', 0.15, 0.15);
  endTurn();
}

function handleSpellClick(index) {
  const cell = boardState[index];
  const top = cell.stack.length > 0 ? cell.stack[cell.stack.length - 1] : null;

  if (activeSpellMode === 'lava') {
    // Cast Volcanic Rift on empty cell
    if (cell.stack.length === 0 && cell.lavaDuration === 0) {
      mana[currentPlayer] -= 2;
      cell.lavaDuration = 2; // Lasts 2 turns
      playTone(120, 'sawtooth', 0.4, 0.2);
      activeSpellMode = null;
      resetSpellButtons();
      endTurn();
    }
  } else if (activeSpellMode === 'stone') {
    // Turn friendly piece to stone
    if (top && top.player === currentPlayer && !top.isStone) {
      mana[currentPlayer] -= 2;
      top.isStone = true;
      playTone(200, 'triangle', 0.3, 0.2);
      activeSpellMode = null;
      resetSpellButtons();
      endTurn();
    }
  } else if (activeSpellMode === 'gust') {
    // Tropical Gust: Slide an unanchored token to an adjacent space
    if (gustSourceIndex === null) {
      if (top && !top.isStone) {
        gustSourceIndex = index;
        playTone(550, 'sine', 0.1);
      }
    } else {
      // Validate cardinal adjacency
      const src = gustSourceIndex;
      const dest = index;
      const isAdjacent = (
        (Math.abs(Math.floor(src / 3) - Math.floor(dest / 3)) + Math.abs((src % 3) - (dest % 3))) === 1
      );

      const destTop = cell.stack.length > 0 ? cell.stack[cell.stack.length - 1] : null;
      const srcTop = boardState[src].stack[boardState[src].stack.length - 1];

      if (isAdjacent && cell.lavaDuration === 0 && (!destTop || (destTop.size < srcTop.size && !destTop.isStone))) {
        mana[currentPlayer] -= 1;
        cell.stack.push(boardState[src].stack.pop());
        playTone(620, 'sine', 0.2);
        activeSpellMode = null;
        gustSourceIndex = null;
        resetSpellButtons();
        endTurn();
      } else {
        gustSourceIndex = null;
      }
    }
  }
}

/* ==========================================================================
   TURN END & WIN DETECTION
   ========================================================================== */
function checkWin() {
  const lines = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
    [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
    [0, 4, 8], [2, 4, 6]             // Diagonals
  ];

  for (let line of lines) {
    const [a, b, c] = line;
    const topA = boardState[a].stack.length ? boardState[a].stack[boardState[a].stack.length - 1].player : null;
    const topB = boardState[b].stack.length ? boardState[b].stack[boardState[b].stack.length - 1].player : null;
    const topC = boardState[c].stack.length ? boardState[c].stack[boardState[c].stack.length - 1].player : null;

    if (topA && topA === topB && topA === topC) {
      return topA;
    }
  }
  return null;
}

function endTurn() {
  // Check victory
  const winner = checkWin();
  if (winner) {
    gameOver = true;
    updateUI();
    showVictory(winner);
    return;
  }

  // Decrement Lava cooldowns
  boardState.forEach(c => {
    if (c.lavaDuration > 0) c.lavaDuration--;
  });

  // Switch Player & Grant 1 Mana (capped at 3)
  currentPlayer = (currentPlayer === PLAYERS.SUN) ? PLAYERS.MOON : PLAYERS.SUN;
  if (mana[currentPlayer] < 3) mana[currentPlayer]++;

  updateUI();
}

function showVictory(winner) {
  Arcade.earn(25);
  playTone(660, 'sine', 0.3, 0.2);
  setTimeout(() => playTone(880, 'sine', 0.4, 0.2), 150);

  const modal = document.getElementById('game-over-modal');
  const title = document.getElementById('winner-title');
  const desc = document.getElementById('winner-desc');

  if (winner === PLAYERS.SUN) {
    title.innerText = '☀️ SUN TIKI VICTORIOUS!';
    title.style.color = 'var(--sun-color)';
    desc.innerText = 'The Island Sun shines bright over aligned totems!';
  } else {
    title.innerText = '🌙 MOON TIKI VICTORIOUS!';
    title.style.color = 'var(--moon-color)';
    desc.innerText = 'The Night Tide rises to claim the ancestral sands!';
  }
  modal.style.display = 'flex';
}

function resetGame() {
  gameOver = false;
  currentPlayer = PLAYERS.SUN;
  selectedSize = 1;
  activeSpellMode = null;
  gustSourceIndex = null;

  inventory[PLAYERS.SUN] = { 1: 3, 2: 3, 3: 2 };
  inventory[PLAYERS.MOON] = { 1: 3, 2: 3, 3: 2 };

  mana[PLAYERS.SUN] = 1;
  mana[PLAYERS.MOON] = 0;

  boardState.forEach(cell => {
    cell.stack = [];
    cell.lavaDuration = 0;
  });

  document.getElementById('game-over-modal').style.display = 'none';
  selectPieceSize(1);
  updateUI();
}

// Start game on load
window.addEventListener('DOMContentLoaded', initBoard);
</script>
<script src="arcade-game-inputs.js"></script></body>
</html>
