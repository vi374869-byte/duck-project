<!doctype html><html data-arcade-game="multi"><head><script src="arcade-economy.js" data-game="multi"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Strike Online</title><style>*{box-sizing:border-box}body{margin:0;background:#151936;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh}.game{width:min(1050px,100vw);height:min(700px,100vh);padding:12px;display:grid;grid-template-rows:auto 1fr auto;gap:9px;background:#272d5b}header,footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold}.pill,button{border:3px solid white;border-radius:12px;padding:8px 11px;font:inherit;font-weight:bold}.pill{background:#35417d}button{background:#ffe99d;color:#6b4800;cursor:pointer}.arena{min-height:0;border:5px solid #ffb087;border-radius:20px;overflow:hidden;background:#10142d}canvas{display:block;width:100%;height:100%;touch-action:none}.help{font-size:.78rem;color:#c8d8ff}</style><link rel="icon" type="image/svg+xml" href="game-logo-multi.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head><body><main class="game"><header><button id="quit">← Lobby</button><b>🎯 SKY STRIKE · ONLINE</b><span><i class="pill" id="room"></i> <i class="pill" id="status">Connecting…</i></span></header><section class="arena"><canvas id="c"></canvas></section><footer><span class="help">WASD / arrows move · Click or touch shoots · Players appear in their own colors.</span><span id="weapon"></span></footer></main><script>(()=>{let q=new URLSearchParams(location.search),name=q.get('name')||'Player',room=q.get('room')||'',weapon=q.get('weapon')||'rifle',c=document.querySelector('#c'),g=c.getContext('2d'),W,H,last=0,keys=new Set(),aim={x:0,y:0,fire:0},me={x:0,y:0,a:0,col:'#a0cdb7'},others=Object.create(null),shots=[],cool=0,ws;document.querySelector('#room').textContent='ROOM '+room;document.querySelector('#weapon').textContent='Weapon: '+weapon;function resize(){let r=c.getBoundingClientRect(),s=Math.min(devicePixelRatio,2);c.width=r.width*s;c.height=r.height*s;g.setTransform(s,0,0,s,0,0);W=r.width;H=r.height;if(!me.x){me.x=W/2;me.y=H/2}}function point(e){let r=c.getBoundingClientRect(),p=e.touches?.[0]||e;aim.x=p.clientX-r.left;aim.y=p.clientY-r.top}function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function fire(){let speed=weapon==='plasma'?420:680;shots.push({x:me.x,y:me.y,vx:Math.cos(me.a)*speed,vy:Math.sin(me.a)*speed,col:weapon==='plasma'?'#d5a0ff':'#9cf5ff',life:1});send({type:'game_event',data:{kind:'shot',x:me.x,y:me.y,a:me.a,weapon}})}let activeSeconds=0;function tick(d){if(ws?.readyState===1 && Object.keys(others).length && !document.hidden && (keys.size || aim.fire)){activeSeconds+=d;if(activeSeconds>=30){activeSeconds-=30;Arcade.earn(5)}}let dx=(keys.has('d')||keys.has('arrowright'))-(keys.has('a')||keys.has('arrowleft')),dy=(keys.has('s')||keys.has('arrowdown'))-(keys.has('w')||keys.has('arrowup'));if(dx||dy){let l=Math.hypot(dx,dy);me.x=Math.max(18,Math.min(W-18,me.x+dx/l*250*d));me.y=Math.max(18,Math.min(H-18,me.y+dy/l*250*d))}const ax=Number(keys.has('l'))-Number(keys.has('j')),ay=Number(keys.has('k'))-Number(keys.has('i'));if(ax||ay){aim.x=me.x+ax*200;aim.y=me.y+ay*200;}me.a=Math.atan2(aim.y-me.y,aim.x-me.x);cool-=d;if((aim.fire||keys.has(" "))&&cool<0){fire();cool=weapon==='plasma'?.45:.14}shots=shots.filter(s=>(s.x+=s.vx*d,s.y+=s.vy*d,s.life-=d)>0);send({type:'player_state',data:{x:me.x,y:me.y,a:me.a,weapon}})}function unit(p,n,col){ArcadeArt.pilot(g,p.x,p.y,p.a,col,n)}function draw(){ArcadeArt.arena(g,W,H);shots.forEach(s=>ArcadeArt.pellet(g,s.x,s.y,s.col));Object.entries(others).forEach(([n,p],i)=>unit(p,n,['#e5b5c8','#c3b1df','#e9cf9b','#a9cbdc'][i%4]));unit(me,name,me.col)}function loop(t){let d=Math.min(.04,(t-last||0)/1000);last=t;tick(d);draw();requestAnimationFrame(loop)}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.hostname+':8765');ws.onopen=()=>{document.querySelector('#status').textContent='ONLINE';send({type:'join_room',room,player:name})};ws.onclose=()=>document.querySelector('#status').textContent='OFFLINE';ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){document.querySelector('#status').textContent=m.message;return}if(m.type==='player_state')others[m.player]=m.data;if(m.type==='player_left')delete others[m.player];if(m.type==='game_event'&&m.data.kind==='shot'){let d=m.data,sp=d.weapon==='plasma'?420:680;shots.push({x:d.x,y:d.y,vx:Math.cos(d.a)*sp,vy:Math.sin(d.a)*sp,col:d.weapon==='plasma'?'#d5a0ff':'#ff9fb4',life:1})}}}let firePointer=null;c.onpointerdown=e=>{firePointer=e.pointerId;c.setPointerCapture(e.pointerId);point(e);aim.fire=1};c.onpointermove=e=>{if(firePointer===null||e.pointerId===firePointer)point(e)};onpointerup=e=>{if(e.pointerId===firePointer){aim.fire=0;firePointer=null}};onblur=()=>{keys.clear();aim.fire=0};onpointercancel=()=>{aim.fire=0;firePointer=null};window.addEventListener("arcade-input-reset",()=>{keys.clear();aim.fire=0;firePointer=null});onkeydown=e=>keys.add(e.key.toLowerCase());onkeyup=e=>keys.delete(e.key.toLowerCase());document.querySelector('#quit').onclick=()=>location.href='sky-strike-lobby.html';new ResizeObserver(resize).observe(c);resize();connect();requestAnimationFrame(loop)})()</script></body></html>
