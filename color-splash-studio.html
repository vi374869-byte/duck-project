  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181f;
      --card-hover: #1f222c;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #ff2a70;
      --border: #272a34;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Sidebar / Navigation */
    aside {
      width: 380px;
      min-width: 380px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 1.5rem;
      overflow-y: auto;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .book-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .thumb-card {
      position: relative;
      background: #1c1f28;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .thumb-card:hover {
      background: var(--card-hover);
      border-color: #3b4050;
    }
    .thumb-card.active {
      border-color: var(--accent);
      background: #231d27;
    }
    .thumb-card.is-locked svg { opacity: .45; }
    .unlock-label { color: #ffd66b; font-size: .75rem; font-weight: 700; }
    #unlock-message { color: #ffd66b; font-size: .8rem; line-height: 1.4; }
    .thumb-card svg {
      width: 100%;
      height: 90px;
      pointer-events: none;
      background: #ffffff;
      border-radius: 4px;
    }
    .thumb-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: #d4d4d8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Delete Button */
    .btn-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      background: rgba(20, 20, 24, 0.85);
      border: 1px solid var(--border);
      color: #d4d4d8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      z-index: 5;
    }
    .thumb-card:hover .btn-delete { opacity: 1; }
    .btn-delete:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    /* Main Workspace */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1.25rem;
    }
    .viewport {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg#active-canvas {
      width: 520px;
      height: 520px;
      display: block;
    }

    /* Crisp Line-Art Rendering */
    .fillable {
      fill: #ffffff;
      stroke: #18181b;
      stroke-width: 0.75;
      stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer;
      transition: fill 0.08s ease;
    }
    .fillable:hover {
      filter: brightness(0.96);
    }

    /* Palette & Controls */
    .palette-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .palette {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      outline: none;
      transition: transform 0.12s ease;
    }
    .swatch.selected {
      border-color: #ffffff;
      transform: scale(1.22);
    }
    .action-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #21242d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn:hover { background: #2c303c; }
    .btn-save { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-save:hover { opacity: 0.9; }
    main { min-width: 0; }
    .viewport { width: min(544px, 100%); }
    svg#active-canvas { width: 100%; height: auto; aspect-ratio: 1; }
    .palette-container { max-width: 100%; }
    .palette { flex-wrap: wrap; justify-content: center; border-radius: 18px; }
    @media (max-width: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; flex-direction: column; padding-bottom: 60px; }
      main { order: -1; padding: 16px; gap: 14px; }
      aside { width: 100%; min-width: 0; max-height: 320px; }
      .btn-delete { opacity: 1; }
      .action-row { flex-wrap: wrap; justify-content: center; }
    }
  </style>

    const PALETTE_COLORS = [
      '#ff2a70', '#e01e5a', '#9b1750', '#ff7597',
      '#a855f7', '#7c3aed', '#4f46e5', '#2563eb',
      '#06b6d4', '#0d9488', '#10b981', '#84cc16',
      '#eab308', '#f97316', '#ef4444', '#78350f',
      '#ffffff', '#cbd5e1', '#64748b', '#18181b'
    ];

    // --- APPLICATION STATE ---
    let currentTemplateId = TEMPLATES[0].id;
    let currentColor = PALETTE_COLORS[0];
    let undoStack = [];

    const canvas = document.getElementById('active-canvas');
    const templatesGrid = document.getElementById('templates-grid');
    const savedGrid = document.getElementById('saved-grid');
    const savedCount = document.getElementById('saved-count');
    const palette = document.getElementById('palette');

    // --- COLOR PALETTE INITIALIZATION ---
    PALETTE_COLORS.forEach((col, idx) => {
      const swatch = document.createElement('button');
      swatch.className = `swatch ${idx === 0 ? 'selected' : ''}`;
      swatch.style.backgroundColor = col;
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        currentColor = col;
      });
      palette.appendChild(swatch);
    });

    // --- WORKSPACE & SVG CONTROL ---
    const DRAWING_COST = 25;
    function drawingUnlocked(id, state = Arcade.read()) {
      return id === TEMPLATES[0].id || (Array.isArray(state.colorDrawings) && state.colorDrawings.includes(id));
    }
    function selectDrawing(id, fills = null) {
      const template = TEMPLATES.find(t => t.id === id);
      if (!template) return;
      const state = Arcade.read();
      if (!drawingUnlocked(id, state)) {
        if (state.coins < DRAWING_COST) {
          document.getElementById('unlock-message').textContent = `You need ${DRAWING_COST - state.coins} more coins to unlock ${template.title}.`;
          return;
        }
        state.coins -= DRAWING_COST;
        state.colorDrawings = [...(Array.isArray(state.colorDrawings) ? state.colorDrawings : []), id];
        Arcade.write(state);
        document.getElementById('unlock-message').textContent = `${template.title} unlocked for 25 coins!`;
      }
      loadTemplate(id, fills);
    }
    function loadTemplate(templateId, stateOverrides = null) {
      const template = TEMPLATES.find(t => t.id === templateId);
      if (!template || !drawingUnlocked(templateId)) return;
      currentTemplateId = templateId;
      undoStack = [];

      canvas.setAttribute('viewBox', template.viewBox);
      canvas.innerHTML = template.markup;

      if (stateOverrides) {
        Object.entries(stateOverrides).forEach(([id, fill]) => {
          const el = canvas.querySelector(`#${CSS.escape(id)}`);
          if (el) el.style.fill = fill;
        });
      }

      document.querySelectorAll('#templates-grid .thumb-card').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.template === templateId);
      });
    }

    canvas.addEventListener('click', (e) => {
      if (!e.target.classList.contains('fillable')) return;

      const prevColor = e.target.style.fill || '#ffffff';
      if (prevColor === currentColor) return;

      undoStack.push({ element: e.target, color: prevColor });
      e.target.style.fill = currentColor;
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      const step = undoStack.pop();
      if (step) step.element.style.fill = step.color;
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      canvas.querySelectorAll('.fillable').forEach(el => el.style.fill = '#ffffff');
      undoStack = [];
    });

    // --- LOCALSTORAGE & PERSISTENCE ---
    function fetchSaves() {
      const saves = Arcade.safeRead('vector_coloring_saves_v2', []);
      return Array.isArray(saves) ? saves.filter(s => s && typeof s.fills === 'object' && s.fills) : [];
    }

    function commitSaves(saves) {
      localStorage.setItem('vector_coloring_saves_v2', JSON.stringify(saves));
    }

    document.getElementById('btn-save').addEventListener('click', () => {
      const fills = {};
      canvas.querySelectorAll('.fillable').forEach(el => {
        if (el.style.fill && el.style.fill !== 'rgb(255, 255, 255)' && el.style.fill !== '#ffffff') {
          fills[el.id] = el.style.fill;
        }
      });

      const saves = fetchSaves();
      const newEntry = {
        saveId: 'art_' + Date.now(),
        templateId: currentTemplateId,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        fills: fills
      };

      if (Object.keys(fills).length >= 3) Arcade.earn(15, 'seven', 'art:' + currentTemplateId);
      saves.unshift(newEntry);
      commitSaves(saves);
      renderSavedGallery();
    });

    function deleteSavedArt(saveId, event) {
      event.stopPropagation();
      let saves = fetchSaves();
      saves = saves.filter(s => s.saveId !== saveId);
      commitSaves(saves);
      renderSavedGallery();
    }

    // --- UI RENDERING ---
    function renderTemplateShelf() {
      templatesGrid.innerHTML = '';
      TEMPLATES.forEach(tpl => {
        const unlocked = drawingUnlocked(tpl.id);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `thumb-card ${tpl.id === currentTemplateId ? 'active' : ''} ${unlocked ? '' : 'is-locked'}`;
        card.dataset.template = tpl.id;
        card.setAttribute('aria-label', unlocked ? `Open ${tpl.title}` : `Unlock ${tpl.title} for 25 coins`);
        card.innerHTML = `
          <svg viewBox="${tpl.viewBox}">${tpl.markup}</svg>
          <span class="thumb-title">${tpl.title}</span>
          <span class="unlock-label">${unlocked ? (tpl.id === TEMPLATES[0].id ? 'Free' : 'Unlocked') : '🔒 Unlock · 25 coins'}</span>
        `;
        card.addEventListener('click', () => selectDrawing(tpl.id));
        templatesGrid.appendChild(card);
      });
    }

    function renderSavedGallery() {
      savedGrid.innerHTML = '';
      const saves = fetchSaves();
      savedCount.textContent = `${saves.length} saved`;

      if (saves.length === 0) {
        savedGrid.innerHTML = `
          <div style="grid-column: span 2; padding: 24px 0; text-align: center; color: var(--text-muted); font-size: 0.75rem;">
            No saved artwork yet.
          </div>
        `;
        return;
      }

      saves.forEach(item => {
        const tpl = TEMPLATES.find(t => t.id === item.templateId);
        if (!tpl) return;

        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.innerHTML = `
          <button class="btn-delete" title="Delete Artwork">&times;</button>
          <svg viewBox="${tpl.viewBox}">${tpl.markup}</svg>
          <span class="thumb-title">${tpl.title}</span>
          <span class="unlock-label">${drawingUnlocked(tpl.id) ? 'Open drawing' : '🔒 Unlock · 25 coins'}</span>
        `;

        Object.entries(item.fills).forEach(([id, fill]) => {
          const path = card.querySelector(`#${CSS.escape(id)}`);
          if (path) path.style.fill = fill;
        });

        card.querySelector('.btn-delete').addEventListener('click', (e) => {
          deleteSavedArt(item.saveId, e);
        });

        card.addEventListener('click', () => {
          selectDrawing(item.templateId, item.fills);
        });

        savedGrid.appendChild(card);
      });
    }

    // --- INITIAL BOOT ---
    window.addEventListener('arcade-economy', () => { renderTemplateShelf(); renderSavedGallery(); });
    renderTemplateShelf();
    renderSavedGallery();
    loadTemplate(TEMPLATES[0].id);
  </script>
