<!doctype html><html data-arcade-game="third"><head><script src="arcade-economy.js" data-game="third"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Candy Racers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#ffd1e5}main{height:100%;display:grid;grid-template-rows:64px 1fr 72px;background:linear-gradient(#9bddff,#ffd5e7 60%,#ff9dcb);color:white}header,footer{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#ef70ab;border-color:#fff;border-style:solid;font-weight:bold}header{border-width:0 0 4px}footer{border-width:4px 0 0;justify-content:center;gap:16px}canvas{width:100%;height:100%;touch-action:none}button{border:3px solid #fff;border-radius:14px;padding:9px 14px;background:#ffdf61;color:#7a315b;font-weight:bold;box-shadow:0 3px #cb8e17;cursor:pointer}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#72255599}.panel{max-width:390px;margin:20px;padding:28px;background:#fff0f8;border:5px solid #fff;border-radius:25px;color:#822d62;text-align:center;box-shadow:0 8px #d95692}.hidden{display:none}</style><link rel="icon" type="image/svg+xml" href="game-logo-third.svg"><link rel="stylesheet" href="arcade-games.css"><script src="pet-a-duck-art.js"></script><script src="arcade-art.js"></script><script src="arcade-controls.js"></script><link rel="stylesheet" href="arcade-controls.css"></head><body><main><header><span><img class="arcade-inline-logo" src="game-logo-third.svg" alt="">Candy Racers</span><span>Score: <b id="score">0</b></span><button id="quit">← Sky Arcade</button></header><canvas id="game" width="900" height="540"></canvas><footer><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></footer></main><div id="start" class="overlay"><div class="panel"><img class="arcade-menu-logo" src="game-logo-third.svg" alt=""><h1>Candy Racers</h1><p>Drag the duck left and right. Collect candy and avoid sour bombs!</p><button id="begin">START RACE</button></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>Sweet run!</h1><p id="result"></p><button id="again">RACE AGAIN</button></div></div><script>const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),startEl=document.getElementById('start'),overEl=document.getElementById('over');let duck=450,things=[],score=0,active=false,last=0,drag=false,wait=0;function steer(cx){let r=c.getBoundingClientRect();duck=Math.max(40,Math.min(860,(cx-r.left)/r.width*900))}function beginGame(){things=[];duck=450;drag=false;score=0;wait=0;active=true;scoreEl.textContent=0;startEl.classList.add('hidden');overEl.classList.add('hidden')}function lose(){active=false;document.getElementById('result').textContent=`You collected ${score} treats!`;overEl.classList.remove('hidden')}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(active){wait-=dt;if(wait<=0){things.push({x:45+Math.random()*810,y:-30,good:Math.random()>.3});wait=.52}for(let i=things.length-1;i>=0;i--){let q=things[i];q.y+=225*dt*c.height/540;if(Math.hypot(q.x-duck,q.y-(c.height-80))<43){if(q.good){score++;Arcade.earn(1);scoreEl.textContent=score;things.splice(i,1)}else{lose();break}}else if(q.y>c.height+30)things.splice(i,1)}}ArcadeArt.candyBackground(g);things.forEach(q=>ArcadeArt.candy(g,q.x,q.y,q.good));ArcadeArt.kart(g,duck,c.height-80);requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);steer(e.clientX)});c.addEventListener('pointermove',e=>{if(drag)steer(e.clientX)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>c.addEventListener(k,()=>drag=false));document.getElementById('left').onpointerdown=()=>duck=Math.max(40,duck-100);document.getElementById('right').onpointerdown=()=>duck=Math.min(860,duck+100);document.getElementById('begin').onclick=beginGame;document.getElementById('again').onclick=beginGame;document.getElementById('quit').onclick=()=>{if(parent!==window)parent.postMessage({type:'game-return-hub'},'*');else location.href='index.html'};new ResizeObserver(()=>{const r=c.getBoundingClientRect();if(r.width>0&&r.height>0){const h=Math.round(900*r.height/r.width);if(c.height!==h)c.height=h;}}).observe(c);requestAnimationFrame(loop);</script><script src="arcade-game-inputs.js"></script></body></html>
